spring:
  application:
    name: technical-docs-search
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docsearch}
    username: ${POSTGRES_USER:docsearch}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:docsearch}
    password: ${RABBITMQ_PASSWORD:changeme}
    listener:
      simple:
        concurrency: ${PROCESSING_CONCURRENCY:2}
        max-concurrency: ${PROCESSING_MAX_CONCURRENCY:4}
        prefetch: 1                       # fair distribution: each consumer takes one task at a time
        default-requeue-rejected: false   # after retries, to the DLQ (do not requeue in a loop)
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:50MB}
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  storage:
    path: ${STORAGE_PATH:./uploads}
  processing:
    max-extracted-chars: ${MAX_EXTRACTED_CHARS:5000000}