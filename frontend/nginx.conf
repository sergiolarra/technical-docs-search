server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Angular routes (/search, /documents/:id) live in the browser: unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so new deployments are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Bundles have content hashes in their names: safe to cache for a year
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Server-sent events: no buffering, long-lived connection (exact match wins over /api/)
    location = /api/events {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same limit as UPLOAD_MAX_REQUEST_SIZE in the backend
        client_max_body_size 50m;
    }
}
