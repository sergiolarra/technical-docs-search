<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/search">Technical Docs Search</a>
  <nav class="nav" aria-label="Main">
    <a mat-button routerLink="/search" routerLinkActive="active">Search</a>
    <a mat-button routerLink="/upload" routerLinkActive="active">Upload@if (pendingUploads() > 0) {<span class="pending" [attr.aria-label]="pendingUploads() + ' processing'">{{ pendingUploads() }}</span>}</a>
  </nav>
  <span class="live" [class.online]="connected()" role="status"
        [attr.title]="connected() ? 'Receiving real-time updates' : 'Reconnecting to the server'">
    <span class="dot"></span>{{ connected() ? 'Live' : 'Reconnecting…' }}
  </span>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
