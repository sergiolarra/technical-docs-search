<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/search">Technical Docs Search</a>
  <nav class="nav" aria-label="Principal">
    <a mat-button routerLink="/search" routerLinkActive="active">Buscar</a>
    <a mat-button routerLink="/upload" routerLinkActive="active">Cargar</a>
  </nav>
  <span class="live" [class.online]="connected()" role="status"
        [attr.title]="connected() ? 'Recibiendo actualizaciones en tiempo real' : 'Reconectando con el servidor'">
    <span class="dot"></span>{{ connected() ? 'En vivo' : 'Reconectando…' }}
  </span>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
